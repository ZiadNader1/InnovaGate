<div class="login-page-container">
  <app-particle-bg></app-particle-bg>

  <div class="login-card-wrapper">
    <div class="login-card glass-card">
      
      <!-- Brand Logo Header -->
      <div class="card-header">
        <a routerLink="/" class="brand-logo-link">
          <img src="assets/images/e29dde23-566d-4a40-a3b2-03e6c0e91e84.png" alt="InnovaGate Logo" class="login-logo-img" />
        </a>
        <h1 class="login-title">
          {{ isAr ? 'تسجيل دخول الإدارة' : 'Admin Portal Sign In' }}
        </h1>
        <p class="login-subtitle">
          {{ isAr ? 'تسجيل الدخول الآمن لإدارة طلبات واستفسارات الأكاديمية' : 'Secure gateway to manage student applications and academy records' }}
        </p>
      </div>


      <!-- Error Alert -->
      <div class="error-alert" *ngIf="errorMessage">
        <i class="fa-solid fa-circle-exclamation alert-icon"></i>
        <span>{{ errorMessage }}</span>
      </div>

      <!-- Login Form -->
      <form (ngSubmit)="onLoginSubmit()" class="login-form">
        
        <!-- Email Field -->
        <div class="form-group">
          <label for="adminEmail" class="form-label">
            <i class="fa-solid fa-envelope"></i>
            <span>{{ isAr ? 'البريد الإلكتروني للإدارة' : 'Admin Email Address' }}</span>
          </label>
          <div class="input-icon-wrapper">
            <i class="fa-regular fa-envelope input-prefix-icon"></i>
            <input 
              type="email" 
              id="adminEmail" 
              name="email"
              class="form-control" 
              [placeholder]="isAr ? 'أدخل البريد الإلكتروني...' : 'Enter your email...'"
              [(ngModel)]="email"
              required
            />
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="adminPassword" class="form-label">
            <i class="fa-solid fa-lock"></i>
            <span>{{ isAr ? 'كلمة المرور' : 'Password' }}</span>
          </label>
          <div class="input-icon-wrapper">
            <i class="fa-solid fa-shield-halved input-prefix-icon"></i>
            <input 
              [type]="showPassword ? 'text' : 'password'" 
              id="adminPassword" 
              name="password"
              class="form-control" 
              [placeholder]="isAr ? 'أدخل كلمة المرور...' : 'Enter your password...'"
              [(ngModel)]="password"
              required
            />
            <button type="button" class="toggle-password-btn" (click)="toggleShowPassword()">
              <i [class]="showPassword ? 'fa-solid fa-eye-slash' : 'fa-solid fa-eye'"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-submit-login" [disabled]="isLoading">
          <i class="fa-solid fa-spinner fa-spin" *ngIf="isLoading"></i>
          <i class="fa-solid fa-arrow-right-to-bracket" *ngIf="!isLoading"></i>
          <span>{{ isLoading ? (isAr ? 'جاري التحقق...' : 'Authenticating...') : (isAr ? 'تسجيل الدخول للوحة الإدارة' : 'Sign In to Dashboard') }}</span>
        </button>

      </form>

      <div class="card-footer">
        <a routerLink="/" class="back-home-link">
          <i class="fa-solid fa-arrow-left"></i>
          <span>{{ isAr ? 'العودة للموقع الرئيسي' : 'Return to Main Website' }}</span>
        </a>
      </div>

    </div>
  </div>
</div>
